name: Build and Release Timesheet Parrot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          node --check src/main/main.cjs
          node --check src/main/db.cjs
          node --check src/main/export.cjs
          node --check src/main/repositories/timeEntriesRepository.cjs
          node --check src/preload/preload.cjs
          node --check src/renderer/main.js
          node --check src/renderer/icons.js

      # Do not run npm audit fix --force. It can downgrade or replace ExcelJS.
      # The package uses ExcelJS 4.4.0 and explicit overrides for stale transitive
      # dependencies reported by npm audit.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  prepare-release:
    name: Prepare GitHub draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Timesheet Parrot ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --draft
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: [quality, prepare-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build_command: npm run build:win
          - name: Linux x64
            os: ubuntu-latest
            build_command: npm run build:linux
          - name: macOS
            os: macos-latest
            build_command: npm run build:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build and publish platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_command }}

      - name: Upload build artifacts for debugging
        uses: actions/upload-artifact@v7
        with:
          name: timesheet-parrot-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
