<div class="p-6 max-w-4xl mx-auto">
    <div class="card p-8">
      <div class="flex items-center gap-5">
        <img src="./assets/parrot.png" class="w-24 h-24 object-contain" data-i18n-title="app.alt" />
        <div>
          <div class="text-3xl font-black" data-i18n="app.name"></div>
          <div class="muted mt-1" data-i18n="about.subtitle"></div>
          <div id="about-version" class="text-xs muted mt-2"></div>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4 mt-8">
        <div class="soft-card">
          <div class="font-bold" data-i18n="about.builtDesktop"></div>
          <div class="muted text-sm mt-1" data-i18n="about.builtDesktopText"></div>
        </div>
        <div class="soft-card">
          <div class="font-bold" data-i18n="about.openSource"></div>
          <div class="muted text-sm mt-1" data-i18n="about.openSourceText"></div>
        </div>
        <div class="soft-card">
          <div class="font-bold" data-i18n="about.localFirst"></div>
          <div class="muted text-sm mt-1" data-i18n="about.localFirstText"></div>
        </div>
        <div class="soft-card">
          <div class="font-bold" data-i18n="about.exports"></div>
          <div class="muted text-sm mt-1" data-i18n="about.exportsText"></div>
        </div>
      </div>

      <div class="mt-8 soft-card">
        <div class="font-bold" data-i18n="update.title"></div>
        <div class="muted text-sm mt-1" data-i18n="update.description"></div>
        <div class="flex flex-wrap items-center gap-3 mt-4">
          <button id="check-updates-btn" class="btn btn-secondary">
            <span data-i18n="update.check"></span>
          </button>
          <button id="install-update-btn" class="btn btn-primary hidden">
            <span data-i18n="update.install"></span>
          </button>
        </div>
        <div id="update-status" class="muted text-sm mt-3"></div>
      </div>

      <div class="mt-8">
        <div class="font-bold" data-i18n="about.technology"></div>
        <div class="flex flex-wrap gap-2 mt-3">
          <span class="badge" data-i18n="about.techElectron"></span>
          <span class="badge" data-i18n="about.techVite"></span>
          <span class="badge" data-i18n="about.techJavaScript"></span>
          <span class="badge" data-i18n="about.techTailwind"></span>
          <span class="badge" data-i18n="about.techHeroicons"></span>
          <span class="badge" data-i18n="about.techSQLite"></span>
          <span class="badge" data-i18n="about.techChart"></span>
          <span class="badge" data-i18n="about.techExcelJS"></span>
        </div>
      </div>
    </div>
    <div class="card p-8 gap-4 mt-8">
      <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 text-cyan-500 flex items-center justify-center gap-2 mb-4">
        <span data-icon="myStory" data-icon-class="w-7 h-7"></span>
      </div>

      <div class="font-bold" data-i18n="about.storyHead"></div>
      <div class="muted text-sm mt-1" data-i18n="about.storyText"></div>
    </div>
    <div class="flex flex-wrap items-center gap-3 mt-4">
      <div class="card p-8 gap-4 mt-8">
        <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 text-cyan-500 flex items-center justify-center gap-2 mb-4">
          <span data-icon="document-arrow-up" data-icon-class="w-7 h-7"></span>
        </div>
        <div class="font-bold" data-i18n="about.contributeHead"></div>
        <div class="muted text-sm mt-1" data-i18n="about.contributeText"></div>
        <div class="flex flex-wrap items-center gap-3 mt-4">
          <a
            href="https://github.com/lonerider79/TimeSheetParrot"
            target="_blank"
            class="btn btn-secondary"
          >
            <span data-i18n="about.contributeButton"></span>
          </a>
        </div>
      </div>
  </div>
</div>
